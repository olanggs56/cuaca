<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaca Langsung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tata letak: satu kolom sempit, seperti lembar pengamatan cuaca. Data di garis tipis, bukan kartu. */
:root {
  --bg: #e9eff2;
  --surface: #fbfcfd;
  --ink: #12222a;
  --ink2: #3c5360;
  --muted: #5d7380;
  --line: #d0dce2;
  --accent: #0b6e8a;
  --accent-ink: #ffffff;
  --warm: #c2570f;
  --bad: #b3261e;
  --font-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d181e; --surface: #14232b; --ink: #e5eef2; --ink2: #b4c7d0; --muted: #8aa1ac;
    --line: #243d48; --accent: #5cc3de; --accent-ink: #082029; --warm: #f2a45f; --bad: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d181e; --surface: #14232b; --ink: #e5eef2; --ink2: #b4c7d0; --muted: #8aa1ac;
  --line: #243d48; --accent: #5cc3de; --accent-ink: #082029; --warm: #f2a45f; --bad: #ff8a80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* Pencarian */
.bar { display: flex; flex-direction: column; gap: 10px; }
.bar h1 { margin: 0; font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.search { position: relative; display: flex; gap: 8px; }
.search input {
  flex: 1; min-width: 0; height: 46px; padding: 0 14px;
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px;
}
.search input::placeholder { color: var(--muted); }
button { font: inherit; cursor: pointer; }
.btn {
  height: 46px; padding: 0 14px; border-radius: 6px; font-weight: 600;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#sugg {
  position: absolute; left: 0; right: 0; top: 52px; z-index: 5; margin: 0; padding: 4px;
  list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.14);
}
#sugg li button {
  display: block; width: 100%; text-align: left; padding: 10px; border: 0; border-radius: 4px;
  background: transparent; color: var(--ink);
}
#sugg li button:hover, #sugg li button:focus-visible { background: var(--bg); }
#sugg small { display: block; color: var(--muted); }

/* Panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
.hero { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; }
.hero .where { grid-column: 1 / -1; }
.hero h2 { margin: 0; font-size: 1.5rem; line-height: 1.2; text-wrap: balance; }
.hero .sub { color: var(--muted); font-size: 0.9375rem; }
.temp { font-size: clamp(4rem, 20vw, 6rem); line-height: 1; font-weight: 600; letter-spacing: -0.04em; }
.temp sup { font-size: 0.4em; font-weight: 500; vertical-align: top; position: relative; top: 0.25em; margin-left: 2px; color: var(--muted); }
.cond { display: flex; align-items: center; gap: 10px; font-size: 1.125rem; font-weight: 500; }
.ico { width: 56px; height: 56px; flex: none; }
.ico.sm { width: 32px; height: 32px; }
.ico * { fill: none; stroke: var(--ink2); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ico .sun, .ico .sun * { stroke: var(--warm); }
.ico .cloud { fill: var(--surface); }
.status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; color: var(--muted); font-size: 0.8125rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* Metrik */
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; margin: 0; }
.metrics > div { padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.metrics dt { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; }
.metrics dd { margin: 2px 0 0; font-size: 1.25rem; font-weight: 500; }
.metrics dd small { font-size: 0.8125rem; color: var(--muted); font-family: var(--font-display); }
@media (min-width: 560px) { .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

h3 { margin: 0 0 12px; font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

/* Per jam */
.hours { display: flex; gap: 0; overflow-x: auto; margin: 0 -18px; padding: 0 18px 6px; scrollbar-width: thin; }
.hour { flex: none; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0; border-right: 1px solid var(--line); }
.hour:last-child { border-right: 0; }
.hour .t { font-size: 0.8125rem; color: var(--muted); }
.hour .v { font-size: 1rem; font-weight: 500; }
.hour .p { font-size: 0.75rem; color: var(--accent); min-height: 1.2em; }

/* Per hari */
.days { list-style: none; margin: 0; padding: 0; }
.day { display: grid; grid-template-columns: 52px 32px 44px minmax(0, 1fr); align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; padding-top: 0; }
.day .d { font-weight: 600; }
.day .p { font-size: 0.8125rem; color: var(--accent); text-align: right; }
.range { display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; align-items: center; gap: 8px; }
.range .lo { color: var(--muted); text-align: right; }
.track { position: relative; height: 6px; border-radius: 3px; background: var(--line); }
.fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--warm)); }

.msg { padding: 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.msg.err { border-color: var(--bad); }
.msg p { margin: 0 0 8px; }
.foot { color: var(--muted); font-size: 0.8125rem; }
.foot a { color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>Cuaca Langsung</h1>
    <form class="search" id="form" autocomplete="off" role="search">
      <label class="sr" for="q">Cari kota</label>
      <input id="q" type="search" placeholder="Cari kota, mis. Bandung" enterkeyhint="search" aria-controls="sugg" aria-expanded="false">
      <button class="btn primary" type="submit">Cari</button>
      <button class="btn" type="button" id="locate" title="Pakai lokasi saya">Lokasi saya</button>
      <ul id="sugg" hidden></ul>
    </form>
  </div>
  <main id="app" aria-live="polite">
    <div class="msg"><p>Memuat data cuaca…</p></div>
  </main>
  <p class="foot">Data cuaca dari <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>, diperbarui otomatis setiap 5 menit.</p>
</div>

<script>
(function () {
  "use strict";

  var DEFAULT_PLACE = { name: "Jakarta", admin: "DKI Jakarta", country: "Indonesia", lat: -6.2146, lon: 106.8451 };
  var REFRESH_MS = 5 * 60 * 1000;

  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), q = $("q"), sugg = $("sugg");
  var place = loadPlace();
  var data = null, fetchedAt = 0, timer = null, clockTimer = null, loadSeq = 0;

  // Kode cuaca WMO -> [teks, ikon]
  var WX = {
    0: ["Cerah", "clear"], 1: ["Cerah berawan", "partly"], 2: ["Berawan sebagian", "partly"], 3: ["Mendung", "cloud"],
    45: ["Berkabut", "fog"], 48: ["Kabut beku", "fog"],
    51: ["Gerimis ringan", "rain"], 53: ["Gerimis", "rain"], 55: ["Gerimis lebat", "rain"],
    56: ["Gerimis beku", "rain"], 57: ["Gerimis beku lebat", "rain"],
    61: ["Hujan ringan", "rain"], 63: ["Hujan sedang", "rain"], 65: ["Hujan lebat", "rain"],
    66: ["Hujan beku", "rain"], 67: ["Hujan beku lebat", "rain"],
    71: ["Salju ringan", "snow"], 73: ["Salju sedang", "snow"], 75: ["Salju lebat", "snow"], 77: ["Butiran salju", "snow"],
    80: ["Hujan lokal ringan", "rain"], 81: ["Hujan lokal", "rain"], 82: ["Hujan lokal deras", "rain"],
    85: ["Hujan salju ringan", "snow"], 86: ["Hujan salju lebat", "snow"],
    95: ["Badai petir", "storm"], 96: ["Badai petir, hujan es", "storm"], 99: ["Badai petir, hujan es lebat", "storm"]
  };
  function wx(code) { return WX[code] || ["Tidak diketahui", "cloud"]; }

  var CLOUD = '<path class="cloud" d="M7.5 18.5h9.5a4 4 0 0 0 .6-7.95 5.5 5.5 0 0 0-10.6 1.2A3.4 3.4 0 0 0 7.5 18.5z"/>';
  var SUN_RAYS = '<path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>';
  function icon(kind, isDay, small) {
    var inner;
    if (kind === "clear") {
      inner = isDay
        ? '<g class="sun"><circle cx="12" cy="12" r="4"/>' + SUN_RAYS + '</g>'
        : '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
    } else if (kind === "partly") {
      inner = isDay
        ? '<g class="sun"><circle cx="8.5" cy="8.5" r="3"/><path d="M8.5 2.5v1.2M2.5 8.5h1.2M4.3 4.3l.9.9M12.7 4.3l-.9.9"/></g><g transform="translate(1.5 1.5)">' + CLOUD + '</g>'
        : '<path d="M13 4.5A5 5 0 0 1 6.5 10 5 5 0 1 0 13 4.5z"/><g transform="translate(1.5 1.5)">' + CLOUD + '</g>';
    } else if (kind === "cloud") {
      inner = '<g transform="translate(0 -1)">' + CLOUD + '</g>';
    } else if (kind === "fog") {
      inner = '<g transform="translate(0 -3)">' + CLOUD + '</g><path d="M5 19.5h14M7 22h10"/>';
    } else if (kind === "rain") {
      inner = '<g transform="translate(0 -3)">' + CLOUD + '</g><path d="M8 19.5l-1 2.5M12.5 19.5l-1 2.5M17 19.5l-1 2.5"/>';
    } else if (kind === "snow") {
      inner = '<g transform="translate(0 -3)">' + CLOUD + '</g><path d="M8 20.5h.01M12 22h.01M16 20.5h.01M10 19h.01M14 19h.01"/>';
    } else {
      inner = '<g transform="translate(0 -3)">' + CLOUD + '</g><path d="M13 14.5l-2.5 3.5h3L11 22"/>';
    }
    return '<svg class="ico' + (small ? ' sm' : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + inner + '</svg>';
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function r(n) { return Math.round(n); }
  function compass(deg) {
    var d = ["U", "TL", "T", "TG", "S", "BD", "B", "BL"];
    return d[Math.round(deg / 45) % 8];
  }
  function uvLabel(u) {
    if (u == null) return "";
    if (u < 3) return "rendah";
    if (u < 6) return "sedang";
    if (u < 8) return "tinggi";
    if (u < 11) return "sangat tinggi";
    return "ekstrem";
  }
  function dayName(dateStr, i) {
    if (i === 0) return "Hari ini";
    var d = new Date(dateStr + "T00:00:00Z");
    return new Intl.DateTimeFormat("id-ID", { weekday: "short", timeZone: "UTC" }).format(d);
  }

  // Penyimpanan lokasi terakhir
  function loadPlace() {
    try {
      var s = localStorage.getItem("cuaca:last");
      if (s) {
        var p = JSON.parse(s);
        if (p && typeof p.lat === "number" && typeof p.lon === "number") return p;
      }
    } catch (e) {}
    return DEFAULT_PLACE;
  }
  function savePlace(p) { try { localStorage.setItem("cuaca:last", JSON.stringify(p)); } catch (e) {} }

  // Ambil data
  function getJSON(url) {
    var ctl = new AbortController();
    var to = setTimeout(function () { ctl.abort(); }, 12000);
    return fetch(url, { signal: ctl.signal }).then(function (res) {
      clearTimeout(to);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }, function (e) { clearTimeout(to); throw e; });
  }

  function forecastUrl(p) {
    return "https://api.open-meteo.com/v1/forecast?latitude=" + encodeURIComponent(p.lat) +
      "&longitude=" + encodeURIComponent(p.lon) +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m,is_day" +
      "&hourly=temperature_2m,precipitation_probability,weather_code,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset" +
      "&timezone=auto&forecast_days=7&wind_speed_unit=kmh";
  }

  function load(showSpinner) {
    var seq = ++loadSeq;
    if (showSpinner && !data) app.innerHTML = '<div class="msg"><p>Memuat data cuaca…</p></div>';
    return getJSON(forecastUrl(place)).then(function (d) {
      if (seq !== loadSeq) return;
      data = d; fetchedAt = Date.now();
      render();
      schedule();
    }).catch(function () {
      if (seq !== loadSeq) return;
      if (data) {
        // Tetap tampilkan data lama, tandai gagal memperbarui
        render(true);
      } else {
        app.innerHTML = '<div class="msg err"><p><strong>Data cuaca tidak bisa diambil.</strong></p>' +
          '<p>Periksa koneksi internet, lalu coba lagi. Jika halaman ini dibuka dari dalam aplikasi atau pratinjau yang memblokir akses internet, buka file ini langsung di browser.</p>' +
          '<button class="btn primary" id="retry" type="button">Coba lagi</button></div>';
        var b = $("retry"); if (b) b.addEventListener("click", function () { load(true); });
      }
      schedule();
    });
  }
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(function () { load(false); }, REFRESH_MS);
  }

  // Tampilan
  function placeLabel() {
    var parts = [];
    if (place.admin && place.admin !== place.name) parts.push(place.admin);
    if (place.country) parts.push(place.country);
    return parts.join(", ");
  }
  function clockText() {
    if (!data) return "";
    try {
      return new Intl.DateTimeFormat("id-ID", {
        weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit",
        hour12: false, timeZone: data.timezone
      }).format(new Date());
    } catch (e) { return ""; }
  }
  function updatedText() {
    var t = new Date(fetchedAt);
    return t.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", hour12: false });
  }

  function render(failed) {
    if (!data) return;
    var c = data.current, h = data.hourly, dly = data.daily;
    var isDay = c.is_day === 1;
    var w = wx(c.weather_code);

    // 24 jam ke depan mulai dari jam saat ini (waktu setempat lokasi)
    var nowHour = c.time.slice(0, 13) + ":00";
    var start = h.time.findIndex(function (t) { return t >= nowHour; });
    if (start < 0) start = 0;
    var hoursHtml = "";
    for (var i = start; i < Math.min(start + 24, h.time.length); i++) {
      var hw = wx(h.weather_code[i]);
      var pp = h.precipitation_probability[i];
      hoursHtml += '<li class="hour">' +
        '<span class="t num">' + (i === start ? "Kini" : esc(h.time[i].slice(11, 16))) + '</span>' +
        icon(hw[1], h.is_day[i] === 1, true) +
        '<span class="v num">' + r(h.temperature_2m[i]) + '°</span>' +
        '<span class="p num">' + (pp != null && pp >= 10 ? pp + '%' : '') + '</span></li>';
    }

    var gmin = Math.min.apply(null, dly.temperature_2m_min);
    var gmax = Math.max.apply(null, dly.temperature_2m_max);
    var span = Math.max(gmax - gmin, 1);
    var daysHtml = "";
    for (var k = 0; k < dly.time.length; k++) {
      var dw = wx(dly.weather_code[k]);
      var lo = dly.temperature_2m_min[k], hi = dly.temperature_2m_max[k];
      var left = ((lo - gmin) / span) * 100, width = Math.max(((hi - lo) / span) * 100, 4);
      var dp = dly.precipitation_probability_max[k];
      daysHtml += '<li class="day" title="' + esc(dw[0]) + '">' +
        '<span class="d">' + esc(dayName(dly.time[k], k)) + '</span>' +
        icon(dw[1], true, true) +
        '<span class="p num">' + (dp != null ? dp + '%' : '') + '</span>' +
        '<span class="range num"><span class="lo">' + r(lo) + '°</span>' +
        '<span class="track"><span class="fill" style="left:' + left.toFixed(1) + '%;width:' + width.toFixed(1) + '%"></span></span>' +
        '<span class="hi">' + r(hi) + '°</span></span></li>';
    }

    var uv = dly.uv_index_max && dly.uv_index_max[0];
    var sunrise = dly.sunrise && dly.sunrise[0] ? dly.sunrise[0].slice(11, 16) : "";
    var sunset = dly.sunset && dly.sunset[0] ? dly.sunset[0].slice(11, 16) : "";

    app.innerHTML =
      '<section class="panel hero" aria-label="Cuaca saat ini">' +
        '<div class="where"><h2>' + esc(place.name) + '</h2>' +
        '<div class="sub">' + esc(placeLabel()) + '</div>' +
        '<div class="sub num" id="clock">' + esc(clockText()) + '</div></div>' +
        '<div><div class="temp num">' + r(c.temperature_2m) + '<sup>°C</sup></div>' +
        '<div class="cond">' + icon(w[1], isDay, false) + '<span>' + esc(w[0]) + '</span></div></div>' +
        '<dl class="metrics" style="grid-column:1/-1;margin-top:8px">' +
          '<div><dt>Terasa seperti</dt><dd class="num">' + r(c.apparent_temperature) + '°C</dd></div>' +
          '<div><dt>Kelembapan</dt><dd class="num">' + r(c.relative_humidity_2m) + '%</dd></div>' +
          '<div><dt>Angin</dt><dd class="num">' + r(c.wind_speed_10m) + ' <small>km/j ' + compass(c.wind_direction_10m) + '</small></dd></div>' +
          '<div><dt>Tekanan</dt><dd class="num">' + r(c.surface_pressure) + ' <small>hPa</small></dd></div>' +
          '<div><dt>Curah hujan</dt><dd class="num">' + (c.precipitation || 0).toFixed(1) + ' <small>mm</small></dd></div>' +
          '<div><dt>Indeks UV hari ini</dt><dd class="num">' + (uv != null ? uv.toFixed(0) : "-") + ' <small>' + uvLabel(uv) + '</small></dd></div>' +
          '<div><dt>Matahari terbit</dt><dd class="num">' + esc(sunrise || "-") + '</dd></div>' +
          '<div><dt>Matahari terbenam</dt><dd class="num">' + esc(sunset || "-") + '</dd></div>' +
        '</dl>' +
        '<div class="status" style="grid-column:1/-1"><span class="dot" aria-hidden="true"></span>' +
        (failed
          ? '<span>Gagal memperbarui. Data terakhir pukul <span class="num">' + esc(updatedText()) + '</span>.</span>'
          : '<span>Diperbarui pukul <span class="num">' + esc(updatedText()) + '</span></span>') +
        '<button class="link" id="refresh" type="button">Perbarui sekarang</button></div>' +
      '</section>' +
      '<section class="panel" aria-label="Per jam"><h3>24 jam ke depan</h3><ol class="hours" style="list-style:none;margin-block:0">' + hoursHtml + '</ol></section>' +
      '<section class="panel" aria-label="Per hari"><h3>7 hari ke depan</h3><ol class="days">' + daysHtml + '</ol></section>';

    var rb = $("refresh");
    if (rb) rb.addEventListener("click", function () { load(false); });
    startClock();
  }

  function startClock() {
    clearInterval(clockTimer);
    clockTimer = setInterval(function () {
      var el = $("clock");
      if (el) el.textContent = clockText();
    }, 30000);
  }

  // Pilih lokasi
  function choose(p) {
    place = p;
    savePlace(p);
    data = null;
    hideSugg();
    q.value = "";
    load(true);
  }

  // Pencarian kota
  var searchTimer = null, searchSeq = 0, results = [];
  function hideSugg() { sugg.hidden = true; sugg.innerHTML = ""; q.setAttribute("aria-expanded", "false"); }
  function geocode(name) {
    var seq = ++searchSeq;
    var url = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(name) + "&count=6&language=id&format=json";
    return getJSON(url).then(function (res) {
      if (seq !== searchSeq) return null;
      results = (res.results || []).map(function (x) {
        return { name: x.name, admin: x.admin1 || "", country: x.country || "", lat: x.latitude, lon: x.longitude };
      });
      return results;
    });
  }
  function showSugg(list) {
    if (!list || !list.length) {
      sugg.innerHTML = '<li style="padding:10px;color:var(--muted)">Kota tidak ditemukan.</li>';
    } else {
      sugg.innerHTML = list.map(function (p, i) {
        var sub = [p.admin, p.country].filter(Boolean).join(", ");
        return '<li><button type="button" data-i="' + i + '">' + esc(p.name) + '<small>' + esc(sub) + '</small></button></li>';
      }).join("");
    }
    sugg.hidden = false;
    q.setAttribute("aria-expanded", "true");
  }

  q.addEventListener("input", function () {
    clearTimeout(searchTimer);
    var v = q.value.trim();
    if (v.length < 2) { hideSugg(); return; }
    searchTimer = setTimeout(function () {
      geocode(v).then(function (l) { if (l) showSugg(l); }).catch(hideSugg);
    }, 300);
  });
  sugg.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-i]");
    if (b) choose(results[Number(b.getAttribute("data-i"))]);
  });
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = q.value.trim();
    if (v.length < 2) return;
    geocode(v).then(function (l) {
      if (l && l.length) choose(l[0]); else if (l) showSugg(l);
    }).catch(function () { showSugg([]); });
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".search")) hideSugg();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideSugg(); });

  // Nama tempat dari koordinat (Nominatim / OpenStreetMap). Gagal = tanpa nama, cuaca tetap tampil.
  function reverseName(lat, lon) {
    var url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&accept-language=id" +
      "&lat=" + encodeURIComponent(lat) + "&lon=" + encodeURIComponent(lon);
    return getJSON(url).then(function (res) {
      var a = (res && res.address) || {};
      return {
        name: a.city || a.town || a.municipality || a.county || a.village || a.suburb || a.state || "",
        admin: a.state || "",
        country: a.country || ""
      };
    }).catch(function () { return {}; });
  }

  // Lokasi saya
  $("locate").addEventListener("click", function () {
    if (!navigator.geolocation) { alert("Browser ini tidak mendukung lokasi."); return; }
    var btn = $("locate");
    btn.disabled = true; btn.textContent = "Mencari…";
    navigator.geolocation.getCurrentPosition(function (pos) {
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      reverseName(lat, lon).then(function (info) {
        btn.disabled = false; btn.textContent = "Lokasi saya";
        choose({ name: info.name || "Lokasi Anda", admin: info.admin || "", country: info.country || "", lat: lat, lon: lon });
      });
    }, function () {
      btn.disabled = false; btn.textContent = "Lokasi saya";
      app.insertAdjacentHTML("afterbegin", '<div class="msg err" id="geoerr"><p>Lokasi tidak bisa dibaca. Izinkan akses lokasi di browser, atau cari nama kota.</p></div>');
      setTimeout(function () { var g = $("geoerr"); if (g) g.remove(); }, 6000);
    }, { timeout: 10000, maximumAge: 60000 });
  });

  // Perbarui saat tab kembali aktif dan data sudah basi
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && Date.now() - fetchedAt > REFRESH_MS) load(false);
  });

  load(true);
})();
</script>
</body>
</html>
